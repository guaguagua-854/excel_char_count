<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 文件字数统计工具</title>
  
  <!-- 🎯 通过 CDN 引入库（不需要安装！） -->
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Microsoft YaHei', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 50px auto;
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }

    /* 🎯 模式切换 */
    .mode-switch {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .mode-btn {
      flex: 1;
      padding: 15px;
      border: 2px solid #ddd;
      background: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s;
      font-weight: bold;
    }

    .mode-btn:hover {
      border-color: #667eea;
    }

    .mode-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-color: transparent;
    }

    /* 📤 上传区域 */
    .upload-area {
      margin-bottom: 25px;
    }

    .upload-label {
      display: block;
      padding: 50px 20px;
      background: #f8f9fa;
      border: 3px dashed #667eea;
      border-radius: 15px;
      text-align: center;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.3s;
    }

    .upload-label:hover {
      background: #e9ecef;
      border-color: #764ba2;
    }

    .upload-label input {
      display: none;
    }

    /* ⏳ 加载中 */
    .loading {
      text-align: center;
      padding: 20px;
      font-size: 18px;
      color: #666;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* 📊 结果展示 */
    .result {
      margin-top: 20px;
    }

    .result-item {
      display: flex;
      align-items: center;
      padding: 18px;
      background: white;
      margin-bottom: 12px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .result-item:hover {
      transform: translateX(5px);
    }

    .result-item.total {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    .result-icon {
      font-size: 32px;
      margin-right: 15px;
    }

    .result-name {
      flex: 1;
      font-size: 16px;
      font-weight: 500;
    }

    .result-count {
      font-size: 20px;
      font-weight: bold;
      color: #667eea;
    }

    .result-item.total .result-count {
      color: white;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📊 文件字数统计工具</h1>

  <!-- 🎯 模式切换 -->
  <div class="mode-switch">
    <button class="mode-btn active" onclick="switchMode('single')">
      📄 单文件模式
    </button>
    <button class="mode-btn" onclick="switchMode('multi')">
      📁 多文件模式
    </button>
  </div>

  <!-- 📤 上传区域 -->
  <div class="upload-area">
    <label class="upload-label" id="uploadLabel">
      📤 点击选择文件
      <input 
        type="file" 
        id="fileInput"
        accept=".docx,.doc,.xlsx,.xls,.pptx,.txt,.md,.csv"
        onchange="handleFileSelect(event)"
      />
    </label>
  </div>

  <!-- #加载中 -->
  <div class="loading hidden" id="loading">
    #正在解析文件...
  </div>

  <!-- 📊 结果展示 -->
  <div class="result" id="result"></div>
</div>

<script>
  // 🎯 模式
  let mode = 'single';
  let items = [];

  // 📊 字数统计（中英文都算）
  function countWords(text) {
    if (!text) return 0;
    const chineseChars = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
    const englishWords = text.trim().split(/\s+/).filter(w => w.length > 0).length;
    return chineseChars + englishWords;
  }

  // 📁 解析单个文件
  async function parseFile(file) {
    const ext = file.name.split('.').pop().toLowerCase();
    let text = '';
    let fileWords = 0;
    let icon = '📄';

    try {
      // 📘 Word 文件
      if (ext === 'docx' || ext === 'doc') {
        icon = '📘';
        const arrayBuffer = await file.arrayBuffer();
        const result = await mammoth.extractRawText({ arrayBuffer });
        text = result.value;
        fileWords = countWords(text);
      }
      // 📊 Excel 文件
      else if (ext === 'xlsx' || ext === 'xls') {
        icon = '📊';
        const arrayBuffer = await file.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        
        let allText = '';
        workbook.SheetNames.forEach(sheetName => {
          const worksheet = workbook.Sheets[sheetName];
          const csv = XLSX.utils.sheet_to_csv(worksheet);
          allText += csv + ' ';
        });
        text = allText;
        fileWords = countWords(text);
      }
      // 📽️ PPT 文件
      else if (ext === 'pptx') {
        icon = '📽️';
        const arrayBuffer = await file.arrayBuffer();
        const pptx = new PptxGenJS();
        pptx.load(arrayBuffer);
        
        let allText = '';
        pptx.slides.forEach(slide => {
          slide.objects.forEach(obj => {
            if (obj.text) allText += obj.text + ' ';
          });
        });
        text = allText;
        fileWords = countWords(text);
      }
      // 📄 文本文件
      else if (['txt', 'md', 'csv'].includes(ext)) {
        icon = '📄';
        text = await file.text();
        fileWords = countWords(text);
      }
      else {
        throw new Error('不支持的格式');
      }
    } catch (error) {
      console.error('解析失败:', file.name, error);
      return { name: file.name, count: 0, icon: '❌', error: error.message };
    }

    return { name: file.name, count: fileWords, icon };
  }

  // 🎯 切换模式
  function switchMode(newMode) {
    mode = newMode;
    const btns = document.querySelectorAll('.mode-btn');
    btns.forEach((btn, i) => {
      btn.classList.toggle('active', (i === 0 && mode === 'single') || (i === 1 && mode === 'multi'));
    });

    const input = document.getElementById('fileInput');
    if (mode === 'multi') {
      input.multiple = true;
      document.getElementById('uploadLabel').innerHTML = '📤 点击选择多个文件<input type="file" id="fileInput" multiple accept=".docx,.doc,.xlsx,.xls,.pptx,.txt,.md,.csv" onchange="handleFileSelect(event)"/>';
    } else {
      input.multiple = false;
      document.getElementById('uploadLabel').innerHTML = '📤 点击选择单个文件<input type="file" id="fileInput" accept=".docx,.doc,.xlsx,.xls,.pptx,.txt,.md,.csv" onchange="handleFileSelect(event)"/>';
    }
    
    items = [];
    document.getElementById('result').innerHTML = '';
  }

  // 📁 处理文件
  async function handleFileSelect(event) {
    const files = event.target.files;
    if (!files.length) return;

    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('result').innerHTML = '';
    items = [];

    let totalWords = 0;

    for (let file of files) {
      const item = await parseFile(file);
      items.push(item);
      totalWords += item.count;
    }

    // 显示结果
    let html = '';
    items.forEach((item, index) => {
      html += `
        <div class="result-item">
          <span class="result-icon">${item.icon}</span>
          <span class="result-name">${item.name}</span>
          <span class="result-count">${item.count.toLocaleString()} 字</span>
        </div>
      `;
    });

    // 总计
    html += `
      <div class="result-item total">
        <span class="result-icon">📊</span>
        <span class="result-name">总计</span>
        <span class="result-count">${totalWords.toLocaleString()} 字</span>
      </div>
    `;

    document.getElementById('result').innerHTML = html;
    document.getElementById('loading').classList.add('hidden');
  }
</script>

</body>
</html>
