<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Excel/PPT字数统计工具（Word标准版）</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      max-width: 900px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
      font-size: 14px;
    }
    
    /* 🎯 模式切换按钮 */
    .mode-switcher {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
      background: #f0f2ff;
      padding: 8px;
      border-radius: 12px;
    }
    .mode-btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      background: white;
      color: #666;
    }
    .mode-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    .mode-btn:hover:not(.active) {
      background: #e9ecef;
    }

    .upload-zone {
      border: 3px dashed #667eea;
      border-radius: 15px;
      padding: 60px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: #f8f9ff;
    }
    .upload-zone:hover {
      border-color: #764ba2;
      background: #f0f2ff;
      transform: translateY(-2px);
    }
    .upload-zone.dragging {
      border-color: #48bb78;
      background: #f0fff4;
      transform: scale(1.02);
    }
    .upload-icon { font-size: 64px; margin-bottom: 15px; }
    .upload-text {
      font-size: 18px;
      color: #667eea;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .upload-hint {
      font-size: 14px;
      color: #999;
    }
    input[type="file"] { display: none; }
    
    .item {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s;
    }
    .item:hover {
      background: #e9ecef;
      transform: translateX(5px);
    }
    .item-name {
      font-weight: 600;
      color: #333;
      font-size: 16px;
    }
    .word-count {
      font-size: 20px;
      font-weight: bold;
      color: #667eea;
      margin-left: 15px;
    }
    .stats {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 2px solid #eee;
    }
    .total-section {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin-top: 20px;
    }
    .total-count {
      font-size: 48px;
      font-weight: bold;
      margin: 10px 0;
    }
    .copy-btn {
      background: white;
      color: #667eea;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s;
    }
    .copy-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 20px;
    }
    .delete-btn {
      background: #ff4757;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }
    .delete-btn:hover {
      background: #ff3838;
      transform: scale(1.05);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 10px;
    }
    .badge-excel { background: #48bb78; color: white; }
    .badge-ppt { background: #ed8936; color: white; }
    .badge-multi { background: #9f7aea; color: white; }

    /* 📋 多文件模式样式 */
    .file-list {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 15px;
    }
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: white;
      border-radius: 8px;
      margin-bottom: 8px;
      transition: all 0.3s;
    }
    .file-item:hover {
      transform: translateX(5px);
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }
    .file-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .file-icon {
      font-size: 24px;
    }
    .file-name {
      font-weight: 600;
      color: #333;
    }
    .file-count {
      font-size: 18px;
      font-weight: bold;
      color: #667eea;
    }
    .file-delete {
      background: #ff4757;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.3s;
    }
    .file-delete:hover {
      background: #ff3838;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    // ✅ Word标准字数统计
    const countWords = (text) => {
      if (!text) return 0;
      
      const str = String(text);
      const noSpaces = str.replace(/\s/g, '');
      
      if (noSpaces.length === 0) return 0;
      
      let wordCount = 0;
      let i = 0;
      
      while (i < noSpaces.length) {
        const char = noSpaces[i];
        const code = char.charCodeAt(0);
        
        // 中文字符
        if (code >= 0x4e00 && code <= 0x9fff) {
          wordCount++;
          i++;
        }
        // 日文假名
        else if ((code >= 0x3040 && code <= 0x309f) || 
                 (code >= 0x30a0 && code <= 0x30ff)) {
          wordCount++;
          i++;
        }
        // 韩文
        else if (code >= 0xac00 && code <= 0xd7af) {
          wordCount++;
          i++;
        }
        // 英文/数字：连续的算1个字
        else if (/[a-zA-Z0-9]/.test(char)) {
          wordCount++;
          while (i < noSpaces.length && /[a-zA-Z0-9]/.test(noSpaces[i])) {
            i++;
          }
        }
        // 中文标点
        else if (/[，。！？、；：""''（）【】《》〈〉]/.test(char)) {
          wordCount++;
          i++;
        }
        // 其他字符不计入
        else {
          i++;
        }
      }
      
      return wordCount;
    };

    // 解析 PPTX文件
    const parsePPTX = async (file) => {
      const zip = await JSZip.loadAsync(file);
      const slides = [];
      
      const slideFiles = Object.keys(zip.files)
        .filter(name => name.match(/^ppt\/slides\/slide\d+\.xml$/))
        .sort((a, b) => {
          const numA = parseInt(a.match(/slide(\d+)/)[1]);
          const numB = parseInt(b.match(/slide(\d+)/)[1]);
          return numA - numB;
        });
      
      for (let slideFile of slideFiles) {
        const content = await zip.files[slideFile].async('string');
        const textMatches = content.match(/<a:t>([^<]*)<\/a:t>/g);
        
        let slideText = '';
        if (textMatches) {
          slideText = textMatches
            .map(match => match.replace(/<\/?a:t>/g, ''))
            .join(' ');
        }
        
        const slideNum = slideFile.match(/slide(\d+)/)[1];
        slides.push({
          name: `第${slideNum}页`,
          text: slideText,
          count: countWords(slideText)
        });
      }
      
      return slides;
    };

    function App() {
      const [mode, setMode] = useState('single'); // 'single' 或 'multi'
      const [items, setItems] = useState([]);
      const [fileName, setFileName] = useState('');
      const [isDragging, setIsDragging] = useState(false);
      const [fileType, setFileType] = useState('');
      const fileInputRef = useRef(null);

      // 处理单个文件
      const processSingleFile = async (file) => {
        setFileName(file.name);
        const ext = file.name.split('.').pop().toLowerCase();
        
        try {
          if (ext === 'xlsx' || ext === 'xls') {
            setFileType('excel');
            const data = await file.arrayBuffer();
            const workbook = XLSX.read(data, { type: 'array' });
            
            const newItems = workbook.SheetNames.map((name, index) => {
              const worksheet = workbook.Sheets[name];
              const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
              
              let totalWords = 0;
              jsonData.forEach(row => {
                row.forEach(cell => {
                  totalWords += countWords(cell);
                });
              });
              
              return {
                type: 'sheet',
                name,
                count: totalWords,
                index
              };
            });
            
            setItems(newItems);
          } 
          else if (ext === 'pptx') {
            setFileType('ppt');
            const slides = await parsePPTX(file);
            setItems(slides);
          }
        } catch (err) {
          alert('❌ 文件解析失败：' + err.message);
        }
      };

      // 处理多个文件
      const processMultiFiles = async (files) => {
        setFileName('多文件汇总模式');
        setFileType('multi');
        
        const allItems = [];
        let totalWords = 0;
        
        for (let file of files) {
          const ext = file.name.split('.').pop().toLowerCase();
          
          try {
            if (ext === 'xlsx' || ext === 'xls') {
              const data = await file.arrayBuffer();
              const workbook = XLSX.read(data, { type: 'array' });
              
              let fileWords = 0;
              workbook.SheetNames.forEach(name => {
                const worksheet = workbook.Sheets[name];
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                
                jsonData.forEach(row => {
                  row.forEach(cell => {
                    fileWords += countWords(cell);
                  });
                });
              });
              
              allItems.push({
                type: 'file',
                name: file.name,
                count: fileWords,
                icon: '📊'
              });
              totalWords += fileWords;
            }
            else if (ext === 'pptx') {
              const slides = await parsePPTX(file);
              const fileWords = slides.reduce((sum, s) => sum + s.count, 0);
              
              allItems.push({
                type: 'file',
                name: file.name,
                count: fileWords,
                icon: '📽️'
              });
              totalWords += fileWords;
            }
          } catch (err) {
            console.error(err);
          }
        }
        
        setItems(allItems);
        // 在多文件模式下，总字数直接显示在items里
        setItems(prev => [...prev, {
          type: 'total',
          name: '总计',
          count: totalWords,
          icon: '📈'
        }]);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          if (mode === 'single') {
            processSingleFile(file);
          } else {
            processMultiFiles([file]);
          }
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          if (mode === 'single') {
            processSingleFile(files[0]);
          } else {
            processMultiFiles(Array.from(files));
          }
        }
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };

      const handleDragLeave = () => {
        setIsDragging(false);
      };

      const deleteItem = (index) => {
        setItems(items.filter((_, i) => i !== index));
      };

      const totalCount = items.length > 0 
        ? items.find(item => item.type === 'total')?.count || 0
        : 0;

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text).then(() => {
          alert('✅ 已复制到剪贴板！');
        });
      };

      return (
        <div className="container">
          <h1>📊 Office字数统计工具</h1>
          <p className="subtitle">支持 Excel (.xlsx/.xls) 和 PPT (.pptx) | Word标准字数统计</p>
          
          {/* 🎯 模式切换 */}
          <div className="mode-switcher">
            <button 
              className={`mode-btn ${mode === 'single' ? 'active' : ''}`}
              onClick={() => { setMode('single'); setItems([]); }}
            >
              📄 单文件明细模式
            </button>
            <button 
              className={`mode-btn ${mode === 'multi' ? 'active' : ''}`}
              onClick={() => { setMode('multi'); setItems([]); }}
            >
              📁 多文件汇总模式
            </button>
          </div>
          
          <div 
            className={`upload-zone ${isDragging ? 'dragging' : ''}`}
            onClick={() => fileInputRef.current.click()}
            onDrop={handleDrop}
            onDragOver={handleDragOver}
            onDragLeave={handleDragLeave}
          >
            <div className="upload-icon">📁</div>
            <div className="upload-text">
              {mode === 'single' ? '点击或拖拽单个文件到此处' : '点击或拖拽多个文件到此处'}
            </div>
            <div className="upload-hint">
              {mode === 'single' 
                ? '支持 Excel (.xlsx/.xls) 和 PPT (.pptx) 格式' 
                : '可同时选择多个文件，只显示总字数'}
            </div>
            <input
              ref={fileInputRef}
              type="file"
              accept=".xlsx,.xls,.pptx"
              multiple={mode === 'multi'}
              onChange={(e) => {
                const files = e.target.files;
                if (files.length > 0) {
                  if (mode === 'single') {
                    processSingleFile(files[0]);
                  } else {
                    processMultiFiles(Array.from(files));
                  }
                }
              }}
            />
          </div>

          {/* 📄 单文件明细模式 */}
          {mode === 'single' && items.length > 0 && (
            <>
              <div style={{ marginTop: '30px' }}>
                <h2 style={{ marginBottom: '15px', color: '#333' }}>
                  📄 {fileName}
                  <span className={`badge ${fileType === 'excel' ? 'badge-excel' : fileType === 'ppt' ? 'badge-ppt' : ''}`}>
                    {fileType === 'excel' ? '📊 Excel' : fileType === 'ppt' ? '📽️ PPT' : ''}
                  </span>
                </h2>
                
                {items.map((item, index) => (
                  <div className="item" key={index}>
                    <div>
                      <div className="item-name">
                        {item.type === 'sheet' ? '📋 Sheet: ' : '🎬 '}
                        {item.name}
                      </div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '15px' }}>
                      <div className="word-count">{item.count.toLocaleString()} 字</div>
                      <button
                        className="copy-btn"
                        onClick={() => copyToClipboard(item.count.toString())}
                      >
                        📋 复制
                      </button>
                      <button
                        className="delete-btn"
                        onClick={() => deleteItem(index)}
                      >
                        🗑️ 删除
                      </button>
                    </div>
                  </div>
                ))}
              </div>

              <div className="total-section">
                <div style={{ fontSize: '18px', marginBottom: '10px' }}>📚 总字数（Word标准）</div>
                <div className="total-count">
                  {items.reduce((sum, item) => sum + item.count, 0).toLocaleString()} 字
                </div>
                <button 
                  className="copy-btn"
                  onClick={() => copyToClipboard(items.reduce((sum, item) => sum + item.count, 0).toString())}
                  style={{ marginTop: '15px' }}
                >
                  📋 复制总字数
                </button>
              </div>
            </>
          )}

          {/* 📁 多文件汇总模式 */}
          {mode === 'multi' && items.length > 0 && (
            <>
              <div style={{ marginTop: '30px' }}>
                <h2 style={{ marginBottom: '15px', color: '#333' }}>
                  📁 多文件汇总
                  <span className="badge badge-multi">批量模式</span>
                </h2>
                
                <div className="file-list">
                  {items.filter(item => item.type !== 'total').map((item, index) => (
                    <div className="file-item" key={index}>
                      <div className="file-info">
                        <div className="file-icon">{item.icon}</div>
                        <div className="file-name">{item.name}</div>
                      </div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '15px' }}>
                        <div className="file-count">{item.count.toLocaleString()} 字</div>
                        <button
                          className="file-delete"
                          onClick={() => deleteItem(index)}
                        >
                          🗑️ 删除
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="total-section">
                  <div style={{ fontSize: '18px', marginBottom: '10px' }}>📚 所有文件总字数（Word标准）</div>
                  <div className="total-count">{totalCount.toLocaleString()} 字</div>
                  <button 
                    className="copy-btn"
                    onClick={() => copyToClipboard(totalCount.toString())}
                    style={{ marginTop: '15px' }}
                  >
                    📋 复制总字数
                  </button>
                </div>
              </div>
            </>
          )}

          <div className="footer">
            {mode === 'single' 
              ? '💡 提示：单文件模式显示各个Sheet/Slide明细 | 点击 🗑️ 删除可移除' 
              : '💡 提示：多文件模式支持批量上传，只显示总字数 | 点击 🗑️ 删除可移除文件'}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
