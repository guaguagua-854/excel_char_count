<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Excel/PPT字数统计工具（Word标准版）</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      max-width: 900px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .upload-zone {
      border: 3px dashed #667eea;
      border-radius: 15px;
      padding: 60px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: #f8f9ff;
    }
    .upload-zone:hover {
      border-color: #764ba2;
      background: #f0f2ff;
      transform: translateY(-2px);
    }
    .upload-zone.dragging {
      border-color: #48bb78;
      background: #f0fff4;
      transform: scale(1.02);
    }
    .upload-icon { font-size: 64px; margin-bottom: 15px; }
    .upload-text {
      font-size: 18px;
      color: #667eea;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .upload-hint {
      font-size: 14px;
      color: #999;
    }
    input[type="file"] { display: none; }
    .item {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s;
    }
    .item:hover {
      background: #e9ecef;
      transform: translateX(5px);
    }
    .item-name {
      font-weight: 600;
      color: #333;
      font-size: 16px;
    }
    .word-count {
      font-size: 20px;
      font-weight: bold;
      color: #667eea;
      margin-left: 15px;
    }
    .stats {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 2px solid #eee;
    }
    .total-section {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin-top: 20px;
    }
    .total-count {
      font-size: 48px;
      font-weight: bold;
      margin: 10px 0;
    }
    .copy-btn {
      background: white;
      color: #667eea;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s;
    }
    .copy-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 20px;
    }
    .delete-btn {
      background: #ff4757;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }
    .delete-btn:hover {
      background: #ff3838;
      transform: scale(1.05);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 10px;
    }
    .badge-excel { background: #48bb78; color: white; }
    .badge-ppt { background: #ed8936; color: white; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    // ✅ Word标准字数统计
    const countWords = (text) => {
      if (!text) return 0;
      
      const str = String(text);
      const noSpaces = str.replace(/\s/g, '');
      
      if (noSpaces.length === 0) return 0;
      
      let wordCount = 0;
      let i = 0;
      
      while (i < noSpaces.length) {
        const char = noSpaces[i];
        const code = char.charCodeAt(0);
        
        // 中文字符
        if (code >= 0x4e00 && code <= 0x9fff) {
          wordCount++;
          i++;
        }
        // 日文假名
        else if ((code >= 0x3040 && code <= 0x309f) || 
                 (code >= 0x30a0 && code <= 0x30ff)) {
          wordCount++;
          i++;
        }
        // 韩文
        else if (code >= 0xac00 && code <= 0xd7af) {
          wordCount++;
          i++;
        }
        // 英文/数字：连续的算1个字
        else if (/[a-zA-Z0-9]/.test(char)) {
          wordCount++;
          while (i < noSpaces.length && /[a-zA-Z0-9]/.test(noSpaces[i])) {
            i++;
          }
        }
        // 中文标点
        else if (/[，。！？、；：""''（）【】《》〈〉]/.test(char)) {
          wordCount++;
          i++;
        }
        // 其他字符不计入
        else {
          i++;
        }
      }
      
      return wordCount;
    };

    // ✅ 解析PPTX文件
    const parsePPTX = async (file) => {
      const zip = await JSZip.loadAsync(file);
      const slides = [];
      
      // 遍历所有slide文件
      const slideFiles = Object.keys(zip.files)
        .filter(name => name.match(/^ppt\/slides\/slide\d+\.xml$/))
        .sort((a, b) => {
          const numA = parseInt(a.match(/slide(\d+)/)[1]);
          const numB = parseInt(b.match(/slide(\d+)/)[1]);
          return numA - numB;
        });
      
      for (let slideFile of slideFiles) {
        const content = await zip.files[slideFile].async('string');
        
        // 提取所有 <a:t> 标签内的文本
        const textMatches = content.match(/<a:t>([^<]*)<\/a:t>/g);
        
        let slideText = '';
        if (textMatches) {
          slideText = textMatches
            .map(match => match.replace(/<\/?a:t>/g, ''))
            .join(' ');
        }
        
        const slideNum = slideFile.match(/slide(\d+)/)[1];
        slides.push({
          name: `第${slideNum}页`,
          text: slideText,
          count: countWords(slideText)
        });
      }
      
      return slides;
    };

    function App() {
      const [items, setItems] = useState([]);
      const [fileName, setFileName] = useState('');
      const [isDragging, setIsDragging] = useState(false);
      const [fileType, setFileType] = useState(''); // excel or ppt
      const fileInputRef = useRef(null);

      const processFile = async (file) => {
        setFileName(file.name);
        setIsDragging(true);
        
        const ext = file.name.split('.').pop().toLowerCase();
        
        try {
          if (ext === 'xlsx' || ext === 'xls') {
            setFileType('excel');
            const data = await file.arrayBuffer();
            const workbook = XLSX.read(data, { type: 'array' });
            
            const newItems = workbook.SheetNames.map((name, index) => {
              const worksheet = workbook.Sheets[name];
              const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
              
              let totalWords = 0;
              jsonData.forEach(row => {
                row.forEach(cell => {
                  totalWords += countWords(cell);
                });
              });
              
              return {
                type: 'sheet',
                name,
                count: totalWords,
                index
              };
            });
            
            setItems(newItems);
          } 
          else if (ext === 'pptx') {
            setFileType('ppt');
            const slides = await parsePPTX(file);
            setItems(slides);
          }
          else {
            alert('❌ 不支持的文件格式！请上传 .xlsx/.xls 或 .pptx 文件');
          }
        } catch (err) {
          console.error(err);
          alert('❌ 文件解析失败：' + err.message);
        } finally {
          setIsDragging(false);
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        const file = e.dataTransfer.files[0];
        if (file) processFile(file);
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };

      const handleDragLeave = () => {
        setIsDragging(false);
      };

      const deleteItem = (index) => {
        setItems(items.filter((_, i) => i !== index));
      };

      const totalCount = items.reduce((sum, item) => sum + item.count, 0);

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text).then(() => {
          alert('✅ 已复制到剪贴板！');
        });
      };

      return (
        <div className="container">
          <h1>📊 Office字数统计工具</h1>
          <p className="subtitle">支持 Excel (.xlsx/.xls) 和 PPT (.pptx) | Word标准字数统计</p>
          
          <div 
            className={`upload-zone ${isDragging ? 'dragging' : ''}`}
            onClick={() => fileInputRef.current.click()}
            onDrop={handleDrop}
            onDragOver={handleDragOver}
            onDragLeave={handleDragLeave}
          >
            <div className="upload-icon">📁</div>
            <div className="upload-text">点击或拖拽文件到此处</div>
            <div className="upload-hint">支持 Excel (.xlsx/.xls) 和 PPT (.pptx) 格式</div>
            <input
              ref={fileInputRef}
              type="file"
              accept=".xlsx,.xls,.pptx"
              onChange={(e) => {
                const file = e.target.files[0];
                if (file) processFile(file);
              }}
            />
          </div>

          {items.length > 0 && (
            <>
              <div style={{ marginTop: '30px' }}>
                <h2 style={{ marginBottom: '15px', color: '#333' }}>
                  📄 {fileName}
                  <span className={`badge ${fileType === 'excel' ? 'badge-excel' : 'badge-ppt'}`}>
                    {fileType === 'excel' ? '📊 Excel' : '📽️ PPT'}
                  </span>
                </h2>
                
                {items.map((item, index) => (
                  <div className="item" key={index}>
                    <div>
                      <div className="item-name">
                        {item.type === 'sheet' ? '📋 Sheet: ' : '🎬 '}
                        {item.name}
                      </div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '15px' }}>
                      <div className="word-count">{item.count.toLocaleString()} 字</div>
                      <button
                        className="copy-btn"
                        onClick={() => copyToClipboard(item.count.toString())}
                      >
                        📋 复制
                      </button>
                      <button
                        className="delete-btn"
                        onClick={() => deleteItem(index)}
                      >
                        🗑️ 删除
                      </button>
                    </div>
                  </div>
                ))}
              </div>

              <div className="total-section">
                <div style={{ fontSize: '18px', marginBottom: '10px' }}>📚 总字数（Word标准）</div>
                <div className="total-count">{totalCount.toLocaleString()} 字</div>
                <button 
                  className="copy-btn"
                  onClick={() => copyToClipboard(totalCount.toString())}
                  style={{ marginTop: '15px' }}
                >
                  📋 复制总字数
                </button>
              </div>
            </>
          )}

          <div className="footer">
            💡 提示：支持 Excel 和 PPT 文件 | 字数统计规则与Word完全一致 | 点击 🗑️ 删除可移除Sheet/Slide
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
