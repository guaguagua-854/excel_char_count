<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Excel字数统计工具（Word标准版）</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      max-width: 900px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .upload-zone {
      border: 3px dashed #667eea;
      border-radius: 15px;
      padding: 60px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: #f8f9ff;
    }
    .upload-zone:hover {
      border-color: #764ba2;
      background: #f0f2ff;
      transform: translateY(-2px);
    }
    .upload-zone.dragging {
      border-color: #48bb78;
      background: #f0fff4;
      transform: scale(1.02);
    }
    .upload-icon { font-size: 64px; margin-bottom: 15px; }
    .upload-text {
      font-size: 18px;
      color: #667eea;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .upload-hint {
      font-size: 14px;
      color: #999;
    }
    input[type="file"] { display: none; }
    .sheet-item {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s;
    }
    .sheet-item:hover {
      background: #e9ecef;
      transform: translateX(5px);
    }
    .sheet-name {
      font-weight: 600;
      color: #333;
      font-size: 16px;
    }
    .word-count {
      font-size: 20px;
      font-weight: bold;
      color: #667eea;
      margin-left: 15px;
    }
    .stats {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 2px solid #eee;
    }
    .total-section {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin-top: 20px;
    }
    .total-count {
      font-size: 48px;
      font-weight: bold;
      margin: 10px 0;
    }
    .copy-btn {
      background: white;
      color: #667eea;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s;
    }
    .copy-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 20px;
    }
    .delete-btn {
      background: #ff4757;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }
    .delete-btn:hover {
      background: #ff3838;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    // ✅ Word标准字数统计
    const countWords = (text) => {
      if (!text) return 0;
      
      const str = String(text);
      
      // 移除所有空白字符（空格、tab、换行等）
      const noSpaces = str.replace(/\s/g, '');
      
      if (noSpaces.length === 0) return 0;
      
      // Word规则：
      // 1. 中文字符：每个算1个字
      // 2. 英文/数字：连续的算1个字（如 "ABC123" = 1个字）
      // 3. 标点符号：中文标点算1个字，英文标点通常不计
      
      let wordCount = 0;
      let i = 0;
      
      while (i < noSpaces.length) {
        const char = noSpaces[i];
        const code = char.charCodeAt(0);
        
        // 中文字符（Unicode范围）
        if (code >= 0x4e00 && code <= 0x9fff) {
          wordCount++;
          i++;
        }
        // 日文假名
        else if ((code >= 0x3040 && code <= 0x309f) || 
                 (code >= 0x30a0 && code <= 0x30ff)) {
          wordCount++;
          i++;
        }
        // 韩文
        else if (code >= 0xac00 && code <= 0xd7af) {
          wordCount++;
          i++;
        }
        // 英文/数字：跳过连续的英文和数字，算1个字
        else if (/[a-zA-Z0-9]/.test(char)) {
          wordCount++;
          // 跳过连续的英文数字
          while (i < noSpaces.length && /[a-zA-Z0-9]/.test(noSpaces[i])) {
            i++;
          }
        }
        // 中文标点（算1个字）
        else if (/[，。！？、；：""''（）【】《》〈〉]/.test(char)) {
          wordCount++;
          i++;
        }
        // 其他字符（英文标点等）不计入
        else {
          i++;
        }
      }
      
      return wordCount;
    };

    function App() {
      const [sheets, setSheets] = useState([]);
      const [fileName, setFileName] = useState('');
      const [isDragging, setIsDragging] = useState(false);
      const fileInputRef = useRef(null);

      const handleFile = (file) => {
        setFileName(file.name);
        const reader = new FileReader();
        reader.onload = (e) => {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          
          const newSheets = workbook.SheetNames.map((name, index) => {
            const worksheet = workbook.Sheets[name];
            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
            
            let totalWords = 0;
            jsonData.forEach(row => {
              row.forEach(cell => {
                totalWords += countWords(cell);
              });
            });
            
            return {
              name,
              count: totalWords,
              index
            };
          });
          
          setSheets(newSheets);
        };
        reader.readAsArrayBuffer(file);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        const file = e.dataTransfer.files[0];
        if (file) handleFile(file);
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };

      const handleDragLeave = () => {
        setIsDragging(false);
      };

      const deleteSheet = (index) => {
        setSheets(sheets.filter((_, i) => i !== index));
      };

      const totalCount = sheets.reduce((sum, sheet) => sum + sheet.count, 0);

      const copyToClipboard = (text, id) => {
        navigator.clipboard.writeText(text).then(() => {
          alert('✅ 已复制到剪贴板！');
        });
      };

      return (
        <div className="container">
          <h1>📊 Excel字数统计工具</h1>
          <p className="subtitle">Word标准字数统计（与Word完全一致）</p>
          
          <div 
            className={`upload-zone ${isDragging ? 'dragging' : ''}`}
            onClick={() => fileInputRef.current.click()}
            onDrop={handleDrop}
            onDragOver={handleDragOver}
            onDragLeave={handleDragLeave}
          >
            <div className="upload-icon">📁</div>
            <div className="upload-text">点击或拖拽Excel文件到此处</div>
            <div className="upload-hint">支持 .xlsx, .xls 格式</div>
            <input
              ref={fileInputRef}
              type="file"
              accept=".xlsx,.xls"
              onChange={(e) => {
                const file = e.target.files[0];
                if (file) handleFile(file);
              }}
            />
          </div>

          {sheets.length > 0 && (
            <>
              <div style={{ marginTop: '30px' }}>
                <h2 style={{ marginBottom: '15px', color: '#333' }}>📄 {fileName}</h2>
                {sheets.map((sheet, index) => (
                  <div className="sheet-item" key={index}>
                    <div>
                      <div className="sheet-name">📋 Sheet{index + 1}: {sheet.name}</div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '15px' }}>
                      <div className="word-count">{sheet.count.toLocaleString()} 字</div>
                      <button
                        className="copy-btn"
                        onClick={() => copyToClipboard(sheet.count.toString(), index)}
                      >
                        📋 复制
                      </button>
                      <button
                        className="delete-btn"
                        onClick={() => deleteSheet(index)}
                      >
                        🗑️ 删除
                      </button>
                    </div>
                  </div>
                ))}
              </div>

              <div className="total-section">
                <div style={{ fontSize: '18px', marginBottom: '10px' }}>📚 总字数（Word标准）</div>
                <div className="total-count">{totalCount.toLocaleString()} 字</div>
                <button 
                  className="copy-btn"
                  onClick={() => copyToClipboard(totalCount.toString(), 'total')}
                  style={{ marginTop: '15px' }}
                >
                  📋 复制总字数
                </button>
              </div>
            </>
          )}

          <div className="footer">
            💡 提示：点击 🗑️ 删除按钮可移除Sheet，总字数会自动更新 | 字数统计规则与Word完全一致
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
